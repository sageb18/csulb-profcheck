<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSULB ProfCheck</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <main class="popup">
        <header class="popup__header">
            <div class="popup__logo">
                <img
                    src="../icons/icon-48.png"
                    alt="CSULB ProfCheck logo"
                    width="48"
                    height="48"
                />
            </div>

            <div>
                <h1 class="popup__title">CSULB ProfCheck</h1>
                <p class="popup__subtitle">Registration made easier.</p>
            </div>
        </header>

        <div class="popup__divider"></div>

        <section class="popup__status">
            <div class="popup__status-dot"></div>
            <span>ProfCheck working!</span>
        </section>

        <p class="popup__description">
            Professor ratings appear automatically inside your
            MyCSULB class search results.
        </p>

        <a
            class="popup__button"
            href="https://my.csulb.edu/"
            target="_blank"
            rel="noopener noreferrer"
        >
            <span>Open MyCSULB</span>
            <span class="popup__arrow">→</span>
        </a>

        <footer class="popup__footer">
            <span>v1.1.0</span>

            <a
                href="#"
                class="popup__footer-link"
            >
                Feedback ↗
            </a>
        </footer>
    </main>
</body>
</html>
