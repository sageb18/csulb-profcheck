<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSULB ProfCheck</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <main class="pc-popup">
        <header class="pc-popup-header">
            <div class="pc-popup-logo">
                <img
                    src="../icons/icon-48.png"
                    alt="CSULB ProfCheck logo"
                    width="48"
                    height="48"
                />
            </div>

            <div>
                <h1 class="pc-popup-title">CSULB ProfCheck</h1>
                <p class="pc-popup-subtitle">Registration made easier.</p>
            </div>
        </header>

        <div class="pc-popup-divider"></div>

        <p class="pc-popup-description">
            Professor ratings appear automatically inside your
            MyCSULB class search results.
        </p>

        <div class="pc-popup-divider"></div>

        <section class="pc-popup-section">
            <h2 class="pc-popup-section-title">Filters</h2>

            <label class="pc-popup-checkbox">
                <input type="checkbox" class="pc-popup-checkbox-input" id="hide-unrated">
                <span class="pc-popup-checkbox-box"></span>
                <span class="pc-popup-checkbox-label">Hide unrated professors</span>
            </label>

            <label class="pc-popup-checkbox">
                <input type="checkbox" class="pc-popup-checkbox-input" id="minimum-rating">
                <span class="pc-popup-checkbox-box"></span>
                <span class="pc-popup-checkbox-label">Filter by minimum rating</span>
                <input type="text" class="pc-popup-checkbox-textbox" id="minimum-rating-value" placeholder="e.g. 3.5">
            </label>
        </section>

        <a class="pc-popup-button" href="https://my.csulb.edu/" target="_blank" rel="noopener noreferrer">
            <span>Open MyCSULB</span>
            <span class="pc-popup-arrow">→</span>
        </a>

        <footer class="pc-popup-footer">
            <span>v1.1.0</span>
            <span>by Sage Taddeo</span>

            <a href="https://chromewebstore.google.com/detail/csulb-profcheck/fmkjoemppgjjnephaebphlcekhnaiepc/reviews?hl=en&authuser=0" 
            class="pc-popup-footer-link">Feedback ↗</a>
        </footer>
    </main>

    <script src="popup.js"></script>
</body>
</html>
